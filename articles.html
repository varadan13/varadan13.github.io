<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articles</title>

  <style>
    /* Mobile-first layout only */

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 24px;
    }

    body {
      margin: 0;
      padding: 0.67rem;
      background: #f5f5f5;
      line-height: 1.7;
      color: #1a1a1a;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 0.83rem 0.75rem;
      overflow-wrap: break-word;
    }

    h1 {
      font-size: 1.75rem;
      line-height: 1.3;
      margin-top: 0;
    }

    h2 {
      font-size: 1.35rem;
      line-height: 1.3;
      margin-top: 2rem;
    }

    h3 {
      font-size: 1.1rem;
      margin-top: 1.5rem;
    }

    li {
      margin-bottom: 0.4rem;
    }

    pre {
      overflow-x: auto;
      padding: 0.58rem;
      background: #f4f4f4;
      border-radius: 0.25rem;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    code {
      white-space: pre;
    }

    blockquote {
      margin: 1rem 0;
      padding: 0.42rem 0.58rem;
      border-left: 4px solid #999;
      background: #fafafa;
      border-radius: 0 0.25rem 0.25rem 0;
      font-style: italic;
      color: #444;
    }

    hr {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 2rem 0;
    }

    img,
    table {
      max-width: 100%;
    }

    .article-list {
      margin-top: 1rem;
    }

    .article-list ul {
      padding-left: 0.83rem;
    }

    header {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-logo {
      height: 2.5rem;
      width: auto;
    }

    header nav {
      display: flex;
      gap: 1.5rem;
    }

    header nav a {
      text-decoration: underline;
      color: #1a1a1a;
      font-size: 0.85rem;
      font-weight: 600;
    }

    footer {
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: 0.75rem;
      color: #888;
    }

    @media (min-width: 768px) {
      html {
        font-size: 18px;
      }

      body {
        padding: 1.78rem;
      }

      .container {
        padding: 2.22rem;
      }
    }
  </style>
</head>

    </nav>
