<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Mobile-first layout only */

      * {
        box-sizing: border-box;
      }

      html {
        font-size: 16px;
      }

      body {
        margin: 0;
        padding: 1rem;
        background: linear-gradient(135deg, #415a77, #778da9);
        min-height: 100vh;
        line-height: 1.7;
        color: #1a1a1a;
        font-family: "Karla", sans-serif;
      }

      .container {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        background: #e0e1dd;
        padding: 1.25rem 1.125rem;
        overflow-wrap: break-word;
      }

      h1,
      h2,
      h3 {
        font-family:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }

      h1 {
        font-size: clamp(1.25rem, 5vw, 1.75rem);
        line-height: 1.3;
        margin-top: 0;
      }

      h2 {
        font-size: 1.35rem;
        line-height: 1.3;
        margin-top: 2rem;
      }

      h3 {
        font-size: 1.1rem;
        margin-top: 1.5rem;
      }

      li {
        margin-bottom: 0.4rem;
      }

      pre {
        max-width: 100%;
        overflow-x: auto;
        padding: 0.875rem;
        background: #f4f4f4;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        line-height: 1.6;
        font-family:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }

      code {
        white-space: pre;
        font-family:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }

      blockquote {
        margin: 1rem 0;
        padding: 0.625rem 0.875rem;
        border-left: 4px solid #999;
        background: #fafafa;
        border-radius: 0 0.375rem 0.375rem 0;
        font-style: italic;
        color: #444;
      }

      hr {
        border: none;
        border-top: 1px solid #e0e0e0;
        margin: 2rem 0;
      }

      img,
      table {
        max-width: 100%;
      }

      nav {
        margin-top: 1.5rem;
      }

      nav ul {
        padding-left: 1.25rem;
      }

      header {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        background: #e0e1dd;
        border-bottom: 1px solid #e0e0e0;
        padding: 0.75rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header-logo {
        height: 2.5rem;
        width: auto;
      }

      header nav {
        display: flex;
        gap: 1.5rem;
      }

      header nav a {
        text-decoration: underline;
        color: #1a1a1a;
        font-size: 0.85rem;
        font-weight: 600;
      }

      footer {
        text-align: center;
        padding: 1.5rem 1rem;
        font-size: 0.75rem;
        color: #000;
      }

      @media (min-width: 768px) {
        html {
          font-size: 16px;
        }

        body {
          padding: 1.78rem;
        }

        .container {
          padding: 2.22rem;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <a href="/"
        ><img src="/assets/header-image.jpg" alt="Kravein" class="header-logo"
      /></a>
       <nav>
        <a href="/">Home</a>
        <a href="/about.html">About Me</a>
        <a href="/posts.html">Posts</a>
        <a href="/articles.html">Articles</a>
      </nav>
    </header>

    <div class="container">
      <h1>Welcome to <u>varadan13.github.io</u></h1>

      <nav>
        <ul>
          <li>
            <a href="/about.html">About Me</a>
          </li>
          <li><a href="/posts.html">Posts</a> - written by Me</li>
          <li><a href="/articles.html">Articles</a> - written by LLMs</li>
        </ul>
      </nav>
    </div>

    <footer>
      <p>
        &copy;
        <script>
          document.write(new Date().getFullYear());
        </script>
        Aneesh R. All rights reserved.
      </p>
    </footer>
  </body>
</html>
