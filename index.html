<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./public/favicon.ico" />
    <title>Varadan13</title>
    <meta name="description" content="Your blog post description here" />
    <meta
      name="keywords"
      content="Personal blog of Aneesh Varadan a web dev based out of Bangalore India."
    />
    <meta name="author" content="Aneesh Varadan" />
    <meta name="robots" content="index, follow" />
    <script src="data.min.js"></script>
    <script src="https://unpkg.com/mithril/mithril.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
    <script src="voice-player.js" defer></script>
  </head>
  <body>
    <div x-data="{ editorials: [...window.editorial_data] }">
      <template x-for="editorial in editorials" :key="editorial.title">
        <div>
          <voice-player
            x-bind:title="editorial.title"
            x-bind:text="editorial.text"
          ></voice-player>
        </div>
      </template>
    </div>
  </body>
</html>
