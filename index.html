<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>

  <style>
    /* Mobile-first layout only */
    
    * {
      box-sizing: border-box;
    }

    html {
      font-size: 24px;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
      line-height: 1.7;
      color: #1a1a1a;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 20px 18px;
      overflow-wrap: break-word;
    }

    h1 {
      font-size: 1.75rem;
      line-height: 1.3;
      margin-top: 0;
    }

    h2 {
      font-size: 1.35rem;
      line-height: 1.3;
      margin-top: 2rem;
    }

    h3 {
      font-size: 1.1rem;
      margin-top: 1.5rem;
    }

    li {
      margin-bottom: 0.4rem;
    }

    pre {
      overflow-x: auto;
      padding: 14px;
      background: #f4f4f4;
      border-radius: 6px;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    code {
      white-space: pre;
    }

    blockquote {
      margin: 1rem 0;
      padding: 10px 14px;
      border-left: 4px solid #999;
      background: #fafafa;
      border-radius: 0 6px 6px 0;
      font-style: italic;
      color: #444;
    }

    hr {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 2rem 0;
    }

    img,
    table {
      max-width: 100%;
    }

    nav {
      margin-top: 24px;
    }

    nav ul {
      padding-left: 20px;
    }

    @media (min-width: 768px) {
      html {
        font-size: 18px;
      }

      body {
        padding: 32px;
      }

      .container {
        padding: 40px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Welcome</h1>

    <p>
      varadan13.github.io
    </p>

    <nav>
      <ul>
        <li>
          <a href="/about.html">About Me</a>
        </li>
        <li>
          <a href="/articles.html">Articles</a>
        </li>
      </ul>
    </nav>

  </div>

</body>
</html>
